name: Yöraportti

on:
  schedule:
    - cron: "30 6 * * *"   # n. klo 9.30 Suomen kesäaikaa / 8.30 talviaikaa
    - cron: "0 12 * * *"   # päivitys, kun MoneyPuckin xG-data on täydentynyt
  workflow_dispatch:
    inputs:
      date:
        description: "Pelipäivä VVVV-KK-PP (tyhjä = Suomen aikaa eilinen)"
        required: false

permissions:
  contents: write

concurrency:
  group: yoraportti
  cancel-in-progress: false

jobs:
  raportti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hae data ja tee raportti
        env:
          GAME_DATE: ${{ inputs.date }}
        run: python -m nhlstats ${GAME_DATE:+--date "$GAME_DATE"}

      - name: Tallenna data ja raportti repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Yöraportti $(date -u +%F)"
            git push
          fi
